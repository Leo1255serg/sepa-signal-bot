name: SEPA Bot

# Запуск только вручную или через внешний cron (cron-job.org).
# Встроенный GitHub schedule на Free+Private ненадёжен — отключён.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Job: morning | midday | close_check | weekly | monthly"
        required: true
        default: "morning"
        type: choice
        options:
          - morning
          - midday
          - close_check
          - weekly
          - monthly

permissions:
  contents: write
  actions: write

concurrency:
  group: sepa-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run SEPA
        env:
          FINVIZ_API_TOKEN: ${{ secrets.FINVIZ_API_TOKEN }}
          FINNHUB_API_TOKEN: ${{ secrets.FINNHUB_API_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then MODE="morning"; fi
          echo "Running mode=$MODE"
          python main.py --mode "$MODE"

      - name: Save portfolio state to repo
        if: always()
        run: |
          git config user.name "sepa-bot"
          git config user.email "sepa-bot@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No portfolio changes to commit"
          else
            git commit -m "chore(data): update SEPA portfolio state [skip ci]"
            git push
          fi
